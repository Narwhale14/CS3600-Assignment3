<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="header">
        <a href="index.html" class="utility-button home-button">Home</a>
        <a href="login.html" class="utility-button">Login</a>
        <a class="utility-button current">Registration</a>
        <a href="logout.html" class="utility-button">Logout</a>
    </div>

    <form class="page-body">
        <h1>Register</h1>
        <div class="inputs">
            <div class="field">
                <input type="text" id="username" placeholder="Username" class="user-input" required>
                <p class="error" id="username-error"></p>
            </div>
            <div class="field">
                <input type="email" id="email" placeholder="Email" class="user-input" required>
                <p class="error" id="email-error"></p>
            </div>
            <div class="field">
                <input type="password" id="password" placeholder="Password" class="user-input" required>
                <p class="error" id="password-error"></p>
            </div>
            <div class="field">
                <input type="password" id="confirm-password" placeholder="Confirm Password" class="user-input" required>
                <p class="error" id="confirm-password-error"></p>
            </div>
        </div>
        <button class="utility-button dark">Register</button>
        <p>Already have an account? <a href="login.html">Log In</a></p>
    </form>
</body>
